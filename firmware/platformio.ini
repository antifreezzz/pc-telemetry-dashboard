[env:esp32-s3-devkitc-1]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.partitions = huge_app.csv
board_build.psram = opi
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio

lib_deps =
    lvgl@^8.3
    moononournation/GFX Library for Arduino@~1.5.0
    h2zero/NimBLE-Arduino@^1.4.2

; Serial must be UART0 (GPIO 43/44): the USB-C connector is wired to a CH340
; USB-UART bridge, NOT to the native USB (GPIO 19/20). GPIO 19 is the touch SDA.
; Native CDC (usb_mode=cdc / CDC_ON_BOOT=1) puts Serial on GPIO 19/20 and the
; host data arriving via /dev/ttyUSB0 (CH340 -> UART0) never reaches the app.
build_flags =
    -DBOARD_HAS_PSRAM
    -DBOARD_HAS_OPI_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=0
    -DNIMBLE_CPP_LOG_LEVEL=0
    -DESP32S3
    -DLV_CONF_INCLUDE_SIMPLE
    ; LVGL is a lib_deps external lib: its sources don't inherit the project
    ; include/ dir, so "lv_conf.h" (LV_CONF_INCLUDE_SIMPLE) resolves to the
    ; package defaults (LV_TICK_CUSTOM=0, REFR_PERIOD=30) unless we expose it.
    -I${PROJECT_DIR}/include
    -Wno-unused-variable
    -Wno-unused-but-set-variable

monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyUSB0
